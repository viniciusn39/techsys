name: techsys-gestao

x-backend-env: &backend_env
  DEBUG: "${DEBUG:-1}"
  SECRET_KEY: "${SECRET_KEY:-dev-secret-key-change-me}"
  ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
  POSTGRES_DB: "${POSTGRES_DB:-techsys_gestao}"
  POSTGRES_USER: "${POSTGRES_USER:-techsys}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-techsys}"
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3091,http://127.0.0.1:3091}"
  # Endereço por onde o AGENTE no cliente alcança a plataforma. Sem isto, a tela
  # monta o comando de instalação com o hostname interno do Docker (backend:8000).
  PUBLIC_URL: "${PUBLIC_URL:-http://localhost:8091}"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-techsys_gestao}"
      POSTGRES_USER: "${POSTGRES_USER:-techsys}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-techsys}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment: *backend_env
    volumes:
      - ./backend:/app
      - ./agente:/agente:ro
    ports:
      - "127.0.0.1:8091:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/app/entrypoint.sh"]

  worker:
    build: ./backend
    environment: *backend_env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "core", "worker", "-l", "info"]

  beat:
    build: ./backend
    environment: *backend_env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "core", "beat", "-l", "info"]

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:3091:3091"
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
